defaults:
  - latent_planner
  - _self_

output_model_name: latent_uncert_planner
subdir: latent_uncert_planner/${now:%Y-%m-%d_%H-%M-%S}

wandb:
  project: lewm-latent-uncert-planner
  name: ${output_model_name}_${planner.horizon}

# UA-Flow settings from "Flow Matching with Uncertainty Quantification and
# Guidance". The model predicts a diagonal velocity log-variance and trains it
# with the corrected conditional beta-NLL objective.
uncertainty:
  beta: 1.0
  correction_weight: 1.0
  density_eps: 1e-5
  min_log_variance: -10.0
  max_log_variance: 10.0
  variance_init: 0.0
